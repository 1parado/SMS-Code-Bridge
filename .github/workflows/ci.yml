name: CI

# 日常 PR 只做检查与测试，不出包、不发布。
# 发布 Release 请打 tag，见 release.yml。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  computer:
    name: Windows 端 (Rust)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 检测工程是否存在
        id: guard
        run: echo "ready=${{ hashFiles('computer/Cargo.toml') != '' }}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.guard.outputs.ready == 'true'
        with:
          components: rustfmt, clippy

      - name: 格式检查
        if: steps.guard.outputs.ready == 'true'
        working-directory: computer
        run: cargo fmt --all -- --check

      - name: 静态检查
        if: steps.guard.outputs.ready == 'true'
        working-directory: computer
        run: cargo clippy --all-targets -- -D warnings

      - name: 单元测试
        if: steps.guard.outputs.ready == 'true'
        working-directory: computer
        run: cargo test --all

  phone:
    name: Android 端 (Kotlin)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 检测工程是否存在
        id: guard
        run: echo "ready=${{ hashFiles('phone/gradlew') != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.guard.outputs.ready == 'true'

      - name: 接受 Android SDK 许可
        if: steps.guard.outputs.ready == 'true'
        run: |
          if command -v sdkmanager > /dev/null 2>&1; then
            yes | sdkmanager --licenses > /dev/null || true
          fi

      - name: JVM 单元测试
        if: steps.guard.outputs.ready == 'true'
        working-directory: phone
        run: chmod +x gradlew && ./gradlew testDebugUnitTest

      - name: Lint
        if: steps.guard.outputs.ready == 'true'
        working-directory: phone
        run: ./gradlew lintDebug
