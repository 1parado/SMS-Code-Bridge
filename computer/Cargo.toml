[package]
name = "sms-code-bridge"
version = "0.6.0"
edition = "2021"
description = "SMS Code Bridge - Windows 端：接收局域网验证码并写入剪贴板"

[build-dependencies]
embed-resource = "2"

[dependencies]
# 协议 v2：验证码消息 AES-256-GCM 加密（纯 Rust 实现，无 OpenSSL 依赖）
aes-gcm = "0.10"
clipboard-win = "5"
dirs = "5"
hmac = "0.12"
# 协议 v2：配对证明 PBKDF2-HMAC-SHA256（纯 Rust 实现）
pbkdf2 = { version = "0.12", features = ["hmac"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# 系统弹窗通知（release 无控制台时的用户触达），复用依赖树中已有版本
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
tray-item = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
